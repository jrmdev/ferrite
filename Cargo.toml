[package]
name = "ferrite-workbench"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
description = "A free native Rust HTTP security testing workbench"
default-run = "ferrite"

[lib]
name = "ferrite"
path = "src/lib.rs"

[[bin]]
name = "ferrite"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui-wgpu", "dep:egui_extras", "dep:rfd", "dep:fontdb"]

[dependencies]
anyhow = "1"
base64 = "0.22"
fs2 = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
# Enable egui-wgpu's default native backend features alongside eframe's wgpu renderer.
egui-wgpu = { version = "0.33", optional = true }
egui_extras = { version = "0.33", default-features = false, optional = true }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
redb = "2.6"
regex = "1"
# Official Model Context Protocol SDK: protocol, version negotiation, cancellation.
rmcp = { version = "3.8", default-features = false, features = ["server", "transport-io"] }
rfd = { version = "0.17", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "custom-provider"] }
rustls-rustcrypto = "0.0.2-alpha"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
url = "2"
webpki-roots = "1"
h2 = "0.4"
http = "1"
bytes = "1"
fastwebsockets = { version = "0.10", default-features = false, features = ["unstable-split"] }
sha1 = "0.10"
md-5 = "0.10"
# Line, word and character diffs for Comparer.
similar = { version = "3", default-features = false, features = ["std", "text", "inline"] }
dirs = "6"
tempfile = "3"
chrono = { version = "0.4.42", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10", features = ["serde"] }
brotli = "9.1"
ruzstd = "0.9"
fontdb = { version = "0.24.0", optional = true }

# Safe wrappers for browser process lifecycle signals (already used by tempfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
