name: Rust
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: ferrite
          - os: windows-latest
            executable: ferrite.exe
          - os: macos-latest
            executable: ferrite
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --no-default-features --all-targets
      - run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: ferrite-${{ runner.os }}
          path: target/release/${{ matrix.executable }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: test-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Prepare release binaries
        run: |
          mkdir release-files
          cp release-artifacts/ferrite-Linux/ferrite release-files/ferrite-linux
          cp release-artifacts/ferrite-Windows/ferrite.exe release-files/ferrite-windows.exe
          cp release-artifacts/ferrite-macOS/ferrite release-files/ferrite-macos
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
